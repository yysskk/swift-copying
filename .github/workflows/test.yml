name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3"]
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: linux-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            linux-swift-${{ matrix.swift }}-spm-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            macos-spm-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  dependency-floor:
    name: Linux (Swift 6.2, swift-syntax 600.0.0)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7

      - name: Pin swift-syntax to the minimum supported version
        # Resolve the graph first so the targeted downgrade can find the
        # dependency: on a fresh checkout `resolve <name> --version` fails
        # until the package has been resolved once.
        run: |
          swift package resolve
          swift package resolve swift-syntax --version 600.0.0

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  swift-syntax-prerelease:
    name: Linux (Swift 6.3, swift-syntax 605.0.0 prerelease)
    runs-on: ubuntu-latest
    container: swift:6.3
    env:
      # Pins swift-syntax above the supported range (see Package.swift). Pinned to
      # an exact tag rather than tracking the newest prerelease, so this job only
      # changes its verdict when this repository changes, never on its own.
      SWIFT_COPYING_SWIFT_SYNTAX_VERSION: "605.0.0-prerelease-2026-06-26"
    steps:
      - uses: actions/checkout@v7

      # No build cache here: the pin re-resolves the graph, so the committed
      # Package.resolved the other jobs key on does not describe this build.

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Lint with swift-format
        run: swift format lint --strict --recursive --parallel Sources Tests Package.swift

  test:
    name: test
    needs: [linux, macos, dependency-floor, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Aggregates the matrix into a single stable status-check name ("test")
      # so the branch ruleset has one context to require regardless of how the
      # matrix legs are named. `if: always()` guarantees this job reports a
      # conclusion even when a dependency fails, so a failure can never be
      # masked by the gate being skipped.
      #
      # `swift-syntax-prerelease` is deliberately absent from `needs`: it builds
      # against an unreleased swift-syntax, so it reports early warning only and
      # must never block a merge on an unrelated change. Keep it out.
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs succeeded."
